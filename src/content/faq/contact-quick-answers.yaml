section:
  eyebrow: Antes de preguntar
  title: Respuestas rápidas
  description: Las tres preguntas que más escuchamos antes de arrancar un proyecto.
groups:
  - title: Respuestas rápidas
    items:
      - question: ¿Qué tan rápido pueden empezar?
        answer: La mayoría de los proyectos arrancan dentro de las cuatro semanas posteriores a la primera llamada. Para sprints, en general podemos hacerlo en dos semanas.
      - question: ¿Firman acuerdos de confidencialidad?
        answer: Sí, firmamos NDAs mutuos como algo habitual antes de entrar en cualquier detalle sensible.
      - question: ¿Dónde están ubicados?
        answer: En San Francisco, pero el equipo trabaja de forma remota en Norteamérica y la UE.
