section:
  eyebrow: Preguntas frecuentes
  title: Preguntas frecuentes
  description: Todo lo que necesitas saber antes de empezar un proyecto con nosotros.
groups:
  - title: Cómo trabajamos
    items:
      - question: ¿Cómo empieza un proyecto?
        answer: Con una llamada de 30 minutos para conocer tu empresa. Si vemos que podemos ayudarte, hacemos un diagnóstico de tus procesos y te entregamos un informe con lo que conviene hacer, en qué orden y cuánto cuesta.
      - question: ¿Y si después del diagnóstico no hace falta automatizar nada?
        answer: Te lo diremos. A veces basta con ordenar un proceso o usar mejor las herramientas que ya tienes. Solo proponemos lo que tiene sentido para tu negocio.
      - question: ¿Quién hace el trabajo?
        answer: El mismo equipo que hace el diagnóstico diseña y construye la solución. Tendrás un único responsable de proyecto de principio a fin.
      - question: ¿Tengo que cambiar las herramientas que ya uso?
        answer: No necesariamente. Trabajamos con lo que ya tienes (tu ERP, tu correo, tus hojas de cálculo, tu tienda online) y solo proponemos cambios cuando aportan algo claro.
      - question: ¿Qué pasa cuando termina el proyecto?
        answer: Formamos a tu equipo, documentamos todo y te entregamos el acceso completo. Si quieres, seguimos con un acompañamiento mensual para mantener, medir y mejorar el sistema.
  - title: Precios y plazos
    items:
      - question: ¿Cuánto cuesta?
        answer: El diagnóstico no tiene costo. Los proyectos van desde 1000 € para una automatización concreta hasta 25.000 € para sistemas más completos. El acompañamiento mensual empieza en 500 €/mes. Siempre trabajamos con precio cerrado antes de empezar.
      - question: ¿Cuánto tarda?
        answer: El diagnóstico lleva 1–2 semanas. Una automatización concreta, 2-3 semanas; un software a medida o una web, 8–14 semanas. Trabajamos por fases para que veas resultados pronto.
      - question: ¿Cuándo voy a ver resultados?
        answer: Desde la primera fase. Empezamos por lo que más impacto tiene y cada fase tiene un objetivo medible.
  - title: Antes de empezar
    items:
      - question: ¿Trabajáis con empresas pequeñas?
        answer: Sí. Trabajamos sobre todo con pymes que ya funcionan, pero sienten que el día a día les consume más tiempo del que debería.
      - question: ¿Qué pasa con mis datos?
        answer: Tus datos son tuyos. Trabajamos conforme al RGPD, firmamos acuerdos de confidencialidad y solo usamos herramientas que cumplen la normativa europea.
      - question: ¿Trabajáis de forma presencial?
        answer: Sí, en Barcelona. En remoto, con visitas cuando el proyecto lo requiere. Para el diagnóstico, siempre que podemos, preferimos conocer tu empresa en persona.
      - question: ¿Cómo es un cliente ideal?
        answer: Alguien que quiere mejorar cómo funciona su empresa, nos cuenta las cosas como son y confía en el proceso. El mejor resultado sale cuando trabajamos juntos, no como proveedor y cliente.
