section:
  eyebrow: Preguntas frecuentes
  title: Preguntas frecuentes
  description: Todo lo que necesitás saber antes de arrancar un proyecto con nosotros.
groups:
  - title: Cómo trabajamos
    items:
      - question: ¿Cómo suele empezar un proyecto?
        answer: La mayoría arranca con una llamada de 30 minutos para definir el alcance. Después te mandamos una propuesta escrita en 3 a 5 días hábiles, con alcance, plazos y precio.
      - question: ¿Trabajan con abonos mensuales?
        answer: Sí. La mayoría de los clientes pasa a un abono mensual después del primer proyecto; así hacemos nuestro mejor trabajo y los equipos logran un ritmo creativo más previsible.
      - question: ¿Cuánto cuesta trabajar con ustedes?
        answer: Los proyectos van desde USD 15k para un sprint de identidad acotado hasta más de USD 120k para campañas integrales multidisciplinarias. Los abonos arrancan en USD 9k por mes.
  - title: Proceso
    items:
      - question: ¿Quién hace el trabajo en realidad?
        answer: Los seniors que conocés en la propuesta son los que trabajan en el proyecto. No le pasamos el trabajo a juniors después del kickoff.
      - question: ¿Cómo manejan las revisiones?
        answer: Dos rondas estructuradas por cada hito importante. Las rondas adicionales se cotizan con total transparencia, aunque son raras cuando el brief es claro.
      - question: ¿Cuáles son los plazos habituales?
        answer: 'Sprints de identidad: 4 a 6 semanas. Campañas fotográficas: 6 a 10 semanas. Proyectos integrales multidisciplinarios: 10 a 14 semanas.'
  - title: Trabajar juntos
    items:
      - question: ¿Trabajan con startups?
        answer: Sí, aunque nos va mejor con equipos que ya lanzaron un producto y están listos para invertir en la marca que lo rodea.
      - question: ¿Pueden trabajar de forma presencial?
        answer: Somos remotos por naturaleza, pero viajamos para kickoffs, sesiones de fotos clave y revisiones de hitos en cualquier lugar de Norteamérica o la UE.
      - question: ¿Cómo es un cliente ideal?
        answer: Alguien que da briefs claros, decide rápido y confía en el oficio. El mejor trabajo siempre sale de equipos que nos tratan como colaboradores, no como proveedores.
