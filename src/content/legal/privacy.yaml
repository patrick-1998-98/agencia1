seoTitle: Política de privacidad — Zypher
seoDescription: Cómo Zypher recopila, usa y protege tu información.
title: Política de privacidad
updated: 2026-05-09
intro: Tu privacidad nos importa. Esta política explica qué datos recopilamos cuando visitás zypher.agency o nos contratás para un proyecto, por qué los recopilamos y cómo los protegemos.
sections:
  - heading: Quiénes somos
    body: Zypher es una agencia de diseño y desarrollo digital con base en Vancouver, BC. Cuando decimos "nosotros" o "nuestro", nos referimos a Zypher Agency.
  - heading: Qué recopilamos
    body: 'Recopilamos solo lo necesario para operar el estudio y responder a tus briefs:'
    items:
      - Datos de contacto que enviás a través de formularios (nombre, email, empresa, mensaje)
      - Información del proyecto compartida durante la definición del alcance y el trabajo
      - Analítica anónima (páginas vistas, país, tipo de dispositivo) para mejorar el sitio
      - Cookies nuestras o de nuestros socios (ver Política de cookies)
  - heading: Cómo la usamos
    body: Usamos tu información para responder tus consultas, llevar adelante los proyectos, enviarte novedades y mantener segura nuestra infraestructura. No vendemos ni alquilamos datos personales a terceros.
  - heading: Dónde se guarda
    body: Tu información se guarda en servicios de confianza (nuestras herramientas de gestión de proyectos, el proveedor de email y el de analítica). Toda la transmisión está cifrada (TLS 1.2+) y solo el equipo tiene acceso.
  - heading: Tus derechos
    body: Podés pedirnos en cualquier momento acceder, corregir o eliminar los datos que tenemos sobre vos. Escribinos a hello@zypher.example y te respondemos dentro de los 30 días.
  - heading: Cambios
    body: Actualizamos esta política a medida que evolucionamos. La fecha de arriba indica la última revisión.
  - heading: Contacto
    body: ¿Tenés preguntas sobre privacidad? Escribinos a hello@zypher.example.
