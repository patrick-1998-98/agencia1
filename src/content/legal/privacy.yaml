seoTitle: Privacy Policy — Zypher
seoDescription: How Zypher collects, uses, and protects your information.
title: Privacy Policy
updated: 2026-05-09
intro: Your privacy matters. This policy explains what data we collect when you visit zypher.agency or hire us for a project, why we collect it, and how we keep it safe.
sections:
  - heading: Who we are
    body: Zypher is a digital design & development agency based in Vancouver, BC. References to "we", "us", and "our" mean Zypher Agency.
  - heading: What we collect
    body: 'We collect only what we need to run the studio and respond to your project briefs:'
    items:
      - Contact details you submit through forms (name, email, company, message)
      - Project information shared during scoping and engagement
      - Anonymous analytics — page views, country, device type — to improve the site
      - Cookies set by us or our partners (see Cookies Policy)
  - heading: How we use it
    body: We use your information to reply to your inquiries, fulfill engagements, send project updates, and keep our infrastructure secure. We do not sell or rent personal data to third parties.
  - heading: Where it lives
    body: Your information is stored on services we trust — our project tools, email provider, and analytics provider. All transit is encrypted (TLS 1.2+) and access is limited to the team.
  - heading: Your rights
    body: You can ask us to access, correct, or delete the data we hold about you at any time. Email hello@zypher.example and we'll respond within 30 days.
  - heading: Changes
    body: We update this policy as we evolve. The date at the top reflects the most recent revision.
  - heading: Contact
    body: Questions about privacy? Email hello@zypher.example.
