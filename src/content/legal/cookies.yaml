seoTitle: Política de cookies — Zypher
seoDescription: Qué cookies usa zypher.agency, para qué y cómo podés controlarlas.
title: Política de cookies
updated: 2026-05-09
intro: Esta página explica qué cookies y tecnologías similares usa zypher.agency, por qué las usamos y cómo podés controlarlas.
sections:
  - heading: Qué son las cookies
    body: Las cookies son pequeños archivos de texto que se guardan en tu dispositivo cuando visitás un sitio. Ayudan a que el sitio recuerde tus preferencias y nos dan información anónima sobre cómo se usa.
  - heading: Cookies que usamos
    items:
      - Esenciales — mantienen el sitio funcionando y recuerdan tu preferencia de tema
      - Analíticas — datos de tráfico anónimos para mejorar el sitio
      - De preferencias — recuerdan configuraciones, como si aceptaste las cookies
  - heading: Cookies de terceros
    body: Algunas cookies las establecen servicios que usamos (analítica, videos embebidos). Esos terceros tienen sus propias políticas de privacidad y de cookies.
  - heading: Tus opciones
    body: Podés bloquear o borrar las cookies cuando quieras desde la configuración de tu navegador. Desactivar las cookies esenciales puede afectar el funcionamiento de algunas partes del sitio.
  - heading: Cambios
    body: Actualizamos esta política a medida que cambiamos las herramientas que usamos. La fecha de arriba indica la última revisión.
  - heading: Contacto
    body: ¿Tenés preguntas sobre las cookies? Escribinos a hello@zypher.example.
