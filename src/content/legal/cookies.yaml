seoTitle: Cookies Policy — Zypher
seoDescription: What cookies zypher.agency uses, why, and how to control them.
title: Cookies Policy
updated: 2026-05-09
intro: This page explains what cookies and similar technologies zypher.agency uses, why we use them, and how you can control them.
sections:
  - heading: What are cookies
    body: Cookies are small text files placed on your device when you visit a site. They help the site remember your preferences and give us anonymous information about how the site is used.
  - heading: Cookies we use
    items:
      - Essential — keep the site running and remember your theme preference
      - Analytics — anonymous traffic data so we can improve the site
      - Preference — remember settings like accepted cookies
  - heading: Third-party cookies
    body: Some cookies are set by services we use (analytics, embedded video). These third parties have their own privacy and cookie policies.
  - heading: Your choices
    body: You can block or delete cookies at any time through your browser settings. Disabling essential cookies may affect how parts of the site work.
  - heading: Changes
    body: We update this policy as we adjust the tools we use. The date at the top reflects the most recent revision.
  - heading: Contact
    body: Questions about cookies? Email hello@zypher.example.
