title: Terms of Service
updated: 2026-05-09
intro: These terms govern your use of zypher.agency and any engagement with the studio. By using the site or hiring us, you agree to the terms below.
sections:
  - heading: Using the site
    body: You may browse, share, and link to zypher.agency for personal or business use. You may not copy our content or claim it as your own.
  - heading: Intellectual property
    body: All content on this site — text, images, code, branding — is owned by Zypher Agency or its licensors. Project deliverables transfer ownership per the terms of each engagement contract.
  - heading: Engagements
    body: Every project is governed by a separate Statement of Work. The SoW takes precedence over these terms for any conflict relating to that engagement.
  - heading: Payments
    body: Project invoices are due within 14 days of issue unless the SoW says otherwise. Late payments may be charged 1.5% per month.
  - heading: Confidentiality
    body: We treat your business as confidential. We sign mutual NDAs as a matter of course before sensitive scoping.
  - heading: Liability
    body: To the maximum extent allowed by law, Zypher's liability for any claim arising from an engagement is limited to the fees paid for that engagement.
  - heading: Termination
    body: Either party may terminate an engagement with written notice per the SoW. Fees for work completed are still owed.
  - heading: Governing law
    body: These terms are governed by the laws of British Columbia, Canada.
  - heading: Contact
    body: Questions about these terms? Email hello@zypher.example.
