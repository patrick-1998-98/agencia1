seoTitle: Términos y condiciones — Zypher
seoDescription: Condiciones que rigen el uso de zypher.agency y la contratación del estudio.
title: Términos y condiciones
updated: 2026-05-09
intro: Estos términos rigen el uso de zypher.agency y cualquier contratación del estudio. Al usar el sitio o contratarnos, aceptás las condiciones que siguen.
sections:
  - heading: Uso del sitio
    body: Podés navegar, compartir y enlazar zypher.agency para uso personal o comercial. No podés copiar nuestro contenido ni presentarlo como propio.
  - heading: Propiedad intelectual
    body: Todo el contenido de este sitio (textos, imágenes, código, marca) pertenece a Zypher Agency o a sus licenciantes. La titularidad de los entregables se transfiere según lo establecido en cada contrato.
  - heading: Proyectos
    body: Cada proyecto se rige por una Declaración de Trabajo (SoW) independiente. Ante cualquier conflicto relacionado con ese proyecto, la SoW prevalece sobre estos términos.
  - heading: Pagos
    body: Las facturas vencen a los 14 días de su emisión, salvo que la SoW indique otra cosa. Los pagos atrasados pueden generar un recargo del 1,5% mensual.
  - heading: Confidencialidad
    body: Tratamos la información de tu negocio como confidencial. Firmamos NDAs mutuos de forma habitual antes de abordar cualquier detalle sensible.
  - heading: Responsabilidad
    body: En la máxima medida permitida por la ley, la responsabilidad de Zypher ante cualquier reclamo derivado de un proyecto se limita a los honorarios pagados por ese proyecto.
  - heading: Rescisión
    body: Cualquiera de las partes puede rescindir un proyecto mediante aviso por escrito según lo previsto en la SoW. Los honorarios por el trabajo ya realizado deben abonarse igual.
  - heading: Ley aplicable
    body: Estos términos se rigen por las leyes de la Columbia Británica, Canadá.
  - heading: Contacto
    body: ¿Tenés preguntas sobre estos términos? Escribinos a hello@zypher.example.
