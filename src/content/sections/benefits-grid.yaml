type: benefits
header:
  eyebrow: Por qué nosotros
  title: Pensado para resultados, no para entregables
  description: Cada proyecto está armado para que tu equipo sea más rápido, más preciso y tenga más confianza en lo que lanza.
items:
  - icon: sparkles
    title: Oficio estratégico
    description: Cada decisión visual parte de investigación, estrategia de marca y conocimiento de la audiencia — nunca de la estética sola.
    stat: 98% de retención
  - icon: bolt
    title: Equipos senior
    description: Siempre trabajás con seniors. Nada de pasarle el proyecto a juniors después del kickoff — quienes presentan son quienes ejecutan.
    stat: 10+ años prom.
  - icon: layer-group
    title: Sistemas primero
    description: Entregamos sistemas de diseño, no piezas sueltas. Todo sale con documentación, componentes y guías.
    stat: Listo para tokens
  - icon: clock
    title: Ritmo predecible
    description: Hitos semanales, plazos transparentes y cero fechas incumplidas. Tu equipo siempre sabe qué viene.
    stat: Siempre a tiempo
  - icon: globe
    title: Red global
    description: Fotógrafos, ilustradores y artistas de motion en 14 ciudades, reunidos según lo que pida el proyecto.
    stat: 14 ciudades
  - icon: shield
    title: Relación a largo plazo
    description: La mayoría de los clientes se queda con nosotros más de 3 años. Invertimos en entender tu negocio, no solo tu brief.
    stat: 3+ años prom.
