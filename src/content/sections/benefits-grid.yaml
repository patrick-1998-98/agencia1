type: benefits
header:
  eyebrow: Por qué nosotros
  title: Pensado para resultados, no para entregables
  description: 'Cada proyecto tiene un objetivo: que tu empresa trabaje con menos esfuerzo, menos errores y más control.'
items:
  - icon: sparkles
    title: Diagnóstico antes que solución.
    description: Cada propuesta parte de entender cómo trabaja tu empresa hoy, nunca de la tecnología de moda.
    stat: Primero entender
  - icon: bolt
    title: Hablas con quien construye.
    description: Quien analiza tu empresa es quien diseña y desarrolla la solución, sin intermediarios.
    stat: Trato directo
  - icon: layer-group
    title: Sistemas, no parches.
    description: Entregamos soluciones conectadas entre sí, documentadas y fáciles de mantener.
    stat: Todo documentado
  - icon: clock
    title: Plazos claros.
    description: Trabajamos por fases con objetivos y fechas definidos desde el inicio. Siempre sabes en qué punto está tu proyecto.
    stat: Por fases
  - icon: globe
    title: Experiencia gestionando empresas.
    description: Antes de construir sistemas, hemos dirigido empresas. Entendemos los problemas porque los hemos vivido.
    stat: Visión de negocio
  - icon: shield
    title: Relación a largo plazo.
    description: Después de la entrega seguimos midiendo y mejorando contigo.
    stat: Acompañamiento
