description: 'Un rediseño completo del sitio de Alva Commerce, hecho como parte del equipo de Hobro Digital. Alva es un equipo de desarrollo eCommerce a medida: el sitio anterior estaba sobrecargado de contenido, era visualmente inconsistente y no tenía un sistema de diseño claro ni una expresión de marca fuerte. Repensamos la experiencia desde cero: un sistema tipográfico limpio, una paleta audaz pero equilibrada y un lenguaje visual coherente con el posicionamiento de Alva.'
