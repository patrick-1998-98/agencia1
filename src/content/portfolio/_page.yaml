carousel:
  eyebrow: Casos de estudio
  title: Proyectos recientes
  description: 'Abre cualquier proyecto para ver el caso completo: el problema, lo que hicimos y el resultado.'
highlights:
  eyebrow: Más allá de lo visual
  title: Cada proyecto deja resultados
  description: 'Lo que queda cuando termina un proyecto: procesos más simples, herramientas que se usan y números para decidir.'
  cards:
    - title: En producción, no en una presentación.
      text: Todo lo que mostramos está funcionando y se usa a diario.
    - title: Alcance y precio cerrados antes de empezar.
      text: Facturación por fases, sin sorpresas al final.
    - title: Hablas con quien lo construye.
      text: Las mismas personas del diagnóstico diseñan y desarrollan tu proyecto, sin traspasos.
    - title: Un solo equipo de principio a fin.
      text: Diagnóstico, procesos, software y web bajo el mismo techo.
