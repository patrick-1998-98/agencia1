# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: zypher-agency
    runtime: node
    plan: free # the free plan sleeps when idle; use starter or above to avoid cold starts
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: SITE_URL
        value: https://zypher-agency.online
      # Secrets: set them in the Render dashboard (sync: false keeps them out of git)
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_TO_EMAIL
        sync: false
      - key: CONTACT_FROM_EMAIL
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: PUBLIC_TURNSTILE_SITE_KEY
        sync: false
